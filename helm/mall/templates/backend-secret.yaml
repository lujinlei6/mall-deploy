apiVersion: v1
kind: Secret
metadata:
  name: mall4j-secrets
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "mall.labels" . | nindent 4 }}
type: Opaque
stringData:
  # 键名直接用环境变量名，由 Deployment 的 envFrom.secretRef 整体注入
  MYSQL_PASSWORD: {{ .Values.secrets.mysqlPassword | quote }}
  # mall4j 的 docker 档没有 Redis 密码项，用 Spring Boot 松散绑定补上（SPRING_DATA_REDIS_PASSWORD → spring.data.redis.password）
  SPRING_DATA_REDIS_PASSWORD: {{ .Values.secrets.redisPassword | quote }}
