{{- if .Values.ingress.enabled }}
# ---------- 后台入口：admin.mall.lab/ 全部流量 → mall4v ----------
# /api 由 mall4v 的 nginx 在容器内反代到 mall4j-admin，Ingress 只负责路由到前端
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: mall-web-admin
  namespace: {{ .Release.Namespace }}
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "false"   # 实验环境走 http，不强制跳 https
spec:
  ingressClassName: {{ .Values.ingress.className }}
  rules:
    - host: {{ .Values.ingress.adminHost }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: mall4v
                port: {number: 80}
---
# ---------- 商城入口：mall.lab/ 全部流量 → mall4uni ----------
# /api 由 mall4uni 的 nginx 在容器内反代到 mall4j-api
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: mall-web-mall
  namespace: {{ .Release.Namespace }}
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
spec:
  ingressClassName: {{ .Values.ingress.className }}
  rules:
    - host: {{ .Values.ingress.mallHost }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: mall4uni
                port: {number: 80}
{{- end }}