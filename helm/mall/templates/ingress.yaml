{{- if .Values.ingress.enabled }}
# ---------- 前端入口：/ 全部流量 → mall4v ----------
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: mall-web
  namespace: {{ .Release.Namespace }}
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "false"   # 实验环境走 http，不强制跳 https
spec:
  ingressClassName: {{ .Values.ingress.className }}
  rules:
    - host: {{ .Values.ingress.host }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: mall4v
                port: {number: 80}
---
# ---------- 后端入口：/api/xxx → 去掉 /api → mall4j-admin ----------
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: mall-api
  namespace: {{ .Release.Namespace }}
  annotations:
    nginx.ingress.kubernetes.io/use-regex: "true"
    nginx.ingress.kubernetes.io/rewrite-target: /$2
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
spec:
  ingressClassName: {{ .Values.ingress.className }}
  rules:
    - host: {{ .Values.ingress.host }}
      http:
        paths:
          - path: {{ .Values.ingress.apiPrefix }}(/|$)(.*)
            pathType: ImplementationSpecific     # 正则路径必须用这个类型
            backend:
              service:
                name: mall4j-admin
                port: {number: 8085}
{{- end }}
