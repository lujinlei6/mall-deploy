{{- if .Values.frontendMall.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mall4uni
  namespace: {{ .Release.Namespace }}
  labels:
    app: mall4uni
    {{- include "mall.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.frontendMall.replicas }}
  selector:
    matchLabels:
      app: mall4uni
  strategy:
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: mall4uni
    spec:
      containers:
        - name: mall4uni
          image: "{{ .Values.frontendMall.image.repository }}:{{ .Values.frontendMall.image.tag }}"
          imagePullPolicy: {{ .Values.frontendMall.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 80
          ## nginx 容器内把 /api 反代到 Service 名 mall4j-api（镜像内置，无需额外配置）
          resources:
            {{- toYaml .Values.frontendMall.resources | nindent 12 }}
          readinessProbe:
            httpGet: {path: /, port: 80}
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /, port: 80}
            initialDelaySeconds: 15
            periodSeconds: 15
{{- end }}