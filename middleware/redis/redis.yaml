apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: kube-mall
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app: redis}
  template:
    metadata:
      labels: {app: redis}
    spec:
      containers:
        - name: redis
          image: harbor.lab/library/redis:7-alpine
          # 认证密码 + 关闭持久化（纯缓存用途；appendonly no 减少磁盘 IO）
          command: ["sh", "-c", "exec redis-server --requirepass \"$REDIS_PASSWORD\" --appendonly no --save ''"]
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef: {name: redis-secret, key: redis-password}
          ports:
            - containerPort: 6379
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: 500m, memory: 256Mi}
          readinessProbe:
            exec:
              command: ["sh", "-c", "redis-cli -a \"$REDIS_PASSWORD\" ping | grep -q PONG"]
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: kube-mall
spec:
  selector: {app: redis}
  ports:
    - name: redis
      port: 6379
      targetPort: 6379
